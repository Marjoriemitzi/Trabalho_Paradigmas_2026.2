# Serviço usado só pelo VS Code Dev Container.
#
# Fica separado do serviço "app" (que expõe a API) de propósito: o VS Code coloca
# no container do editor o seu SSH agent e as credenciais do git. Assim, se a API for
# comprometida, esse container com credenciais não é atingido.
#
# O projeto é montado com escrita (você edita o código aqui), MAS os arquivos que
# conseguem executar comandos no seu computador (fora do container) ficam somente leitura:
#   - .git/hooks e .git/config  -> rodam no host a cada git commit / git status
#   - .devcontainer/            -> "initializeCommand" roda no host
#   - docker-compose.yml, Dockerfile -> poderiam montar o disco do host no próximo build
#   - scripts/                  -> contém o hook de commit que roda no host
#   - .gitignore                -> impede que o .env vá para o git
#   - .dockerignore             -> impede que segredos entrem na imagem
# Para alterar esses arquivos, edite pelo terminal do WSL (fora do container).
# ATENÇÃO: com vários arquivos de compose, caminhos relativos partem da pasta do PRIMEIRO
# arquivo (a raiz do projeto), não desta pasta. Por isso aqui é "." e não "..".
services:
  dev:
    build:
      context: .
      target: dev
    command: sleep infinity
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:?defina APP_DB_USER no .env}:${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env}@db:5432/${POSTGRES_DB:?defina POSTGRES_DB no .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
    volumes:
      - .:/app
      - ./.git/hooks:/app/.git/hooks:ro
      - ./.git/config:/app/.git/config:ro
      - ./.devcontainer:/app/.devcontainer:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./Dockerfile:/app/Dockerfile:ro
      - ./scripts:/app/scripts:ro
      - ./.gitignore:/app/.gitignore:ro
      - ./.dockerignore:/app/.dockerignore:ro
    depends_on:
      db:
        condition: service_healthy
