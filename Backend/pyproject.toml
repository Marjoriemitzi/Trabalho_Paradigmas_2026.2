[tool.poetry]
name = "finance-manager"
version = "0.1.0"
description = "Gerenciador de finanças pessoais — FastAPI + Prolog"
authors = ["Samuel Caetano <samueln.caetano42@gmail.com>"]
readme = "README.md"
packages = [{ include = "app", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.160,<1.0"
starlette = ">=0.49.1"
uvicorn = { extras = ["standard"], version = ">=0.54,<1.0" }
pydantic = "^2.9"
pydantic-settings = "^2.6"
email-validator = "^2.2"
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
alembic = "^1.13"
asyncpg = "^0.31"
pyswip = "^0.3"
argon2-cffi = "^23.1"
pyjwt = "^2.15.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.4.1"
pytest-cov = "^7.1.0"
httpx = "^0.27"
mypy = "^1.13"
ruff = "^0.7"
taskipy = "^1.14"
pip-audit = "^2.10"
mutmut = "^3.8.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF",
    "ANN", "FBT", "PLR", "TCH", "PT", "ARG", "ERA",
]

# ANN101/ANN102 (anotar self e cls) e PT004 estão obsoletas no ruff e não ajudam o mypy.
ignore = ["ANN101", "ANN102", "PT004"]

[tool.ruff.lint.pylint]
# Os construtores do domínio (record, revise) levam 6 a 7 campos de verdade.
max-args = 8

[tool.ruff.lint.per-file-ignores]
# Nos testes: asserts, segredos de exemplo, números nas asserções (status HTTP, centavos) e
# fixtures pedidas só pelo efeito colateral (banco migrado, variáveis de ambiente).
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ARG001", "ARG002"]
# O framework dita a assinatura: `request`/`exc` dos handlers e `current` das rotas, que
# existe só para exigir o login.
"src/app/shared/presentation/api/error_handlers.py" = ["ARG001"]
"src/app/**/routers/*.py" = ["ARG001"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
strict_equality = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "explicit-override",
]
plugins = ["pydantic.mypy"]

# Nos testes, as fixtures que sobrescrevem as dos contratos não ganham nada com @override.
[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["explicit-override"]

[[tool.mypy.overrides]]
module = "pyswip.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.shared.infrastructure.prolog.gateway"
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error::RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
addopts = "--strict-markers --cov=app --cov-report=term-missing"

[tool.taskipy.tasks]
run = "uvicorn app.main:app --reload"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy src tests"
audit = "pip-audit --skip-editable --progress-spinner off"
openapi = "python -m app.export_openapi openapi/openapi.json"
mutate = "sh -c 'rm -rf /tmp/mutmut-work && mkdir -p /tmp/mutmut-work && cp -r /app/src /app/tests /app/pyproject.toml /tmp/mutmut-work/ && cd /tmp/mutmut-work && mutmut run && mutmut results'"
check = "ruff check . && mypy src tests && pytest && pip-audit --skip-editable --progress-spinner off"

[tool.mutmut]
source_paths = ["src/"]
only_mutate = [
    "src/app/finance/domain/*",
    "src/app/users/domain/*",
]
pytest_add_cli_args_test_selection = [
    "tests/finance/unit/domain",
    "tests/users/unit/domain",
]
pytest_add_cli_args = ["--no-cov"]
use_git_change_detection = false
