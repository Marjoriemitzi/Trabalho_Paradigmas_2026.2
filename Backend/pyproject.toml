[tool.poetry]
name = "finance-manager"
version = "0.1.0"
description = "Gerenciador de finanças pessoais — FastAPI + Prolog"
authors = ["Samuel Caetano <samueln.caetano42@gmail.com>"]
readme = "README.md"
packages = [{ include = "app", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.160,<1.0"
starlette = ">=0.49.1"
uvicorn = { extras = ["standard"], version = ">=0.54,<1.0" }
pydantic = "^2.9"
pydantic-settings = "^2.6"
email-validator = "^2.2"
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
alembic = "^1.13"
asyncpg = "^0.31"
pyswip = "^0.3"
argon2-cffi = "^23.1"
pyjwt = "^2.15.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.4.1"
pytest-cov = "^7.1.0"
httpx = "^0.27"
mypy = "^1.13"
ruff = "^0.7"
taskipy = "^1.14"
pip-audit = "^2.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "pyswip.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.shared.infrastructure.prolog.gateway"
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error::RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
addopts = "--cov=app --cov-report=term-missing"

[tool.taskipy.tasks]
run = "uvicorn app.main:app --reload"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy src tests"
audit = "pip-audit --skip-editable --progress-spinner off"
check = "ruff check . && mypy src tests && pytest && pip-audit --skip-editable --progress-spinner off"
