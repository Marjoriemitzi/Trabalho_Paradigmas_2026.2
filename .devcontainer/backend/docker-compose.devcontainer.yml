services:
  dev:
    build:
      context: ./Backend
      target: dev
    command: sleep infinity
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:?defina APP_DB_USER no .env}:${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env}@db:5432/${POSTGRES_DB:?defina POSTGRES_DB no .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-30}
    volumes:
      - ./Backend:/app
      - ./Backend/Dockerfile:/app/Dockerfile:ro
      - ./Backend/.gitignore:/app/.gitignore:ro
      - ./Backend/.dockerignore:/app/.dockerignore:ro
    depends_on:
      db:
        condition: service_healthy
